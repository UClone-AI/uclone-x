# Publish to PyPI when a version tag is pushed, then create its GitHub Release.
#
# PyPI trusted publishing: no token is stored anywhere. PyPI accepts the upload
# because it comes from this workflow, in this repository, in the `pypi`
# environment, as registered once under the project's Publishing settings. The
# GitHub Release is created with this run's own GITHUB_TOKEN.
#
# Run by hand (Actions tab, "Run workflow", with a tag), it creates the GitHub
# Release for a tag that already exists and touches nothing else: no build, no
# PyPI upload. A Release that already exists is left as it is, on either path.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to create the GitHub Release for, e.g. v0.3.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only a snapshot already on main, where CI has run, is released.
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # A tag that disagrees with the version would publish a release under a
      # name its own `ucx version` contradicts, and PyPI never takes a version back.
      - name: Tag matches the package version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          }

      - name: Build
        run: uv build

      - name: Check
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish
    # A dispatched run skips `publish`, which would otherwise skip this job too.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # This run's own commit, which carries the notes script; older tags predate it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag exists
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]] || {
            echo "::error::'$TAG' is not a version tag (vX.Y.Z)"
            exit 1
          }
          git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" >/dev/null || {
            echo "::error::tag $TAG does not exist in this repository"
            exit 1
          }

      # Notes are the tag's own CHANGELOG entry; a missing or empty entry fails here.
      - name: Release notes
        run: |
          set -euo pipefail
          git show "refs/tags/${TAG}:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          python3 .github/scripts/changelog_section.py "${TAG#v}" "$RUNNER_TEMP/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # A re-run, or a backfill of a tag that already has one, leaves the Release alone.
      - name: Release already exists
        id: existing
        run: |
          set -euo pipefail
          if out="$(gh release view "$TAG" --json tagName 2>&1)"; then
            echo "::notice::the GitHub Release for $TAG already exists; leaving it unchanged"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$out" == *"release not found"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Built distributions
        if: steps.existing.outputs.exists == 'false' && github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          version="${TAG#v}"
          args=(--verify-tag --title "uclone-x ${version}" --notes-file "$RUNNER_TEMP/notes.md")
          [[ "$version" =~ (a|b|rc)[0-9]+$ ]] && args+=(--prerelease)
          assets=()
          [[ -d dist ]] && assets=(dist/*)
          gh release create "$TAG" "${args[@]}" "${assets[@]}"
