version: "3.8"

services:
  uclone-x:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uclone-x-dashboard
    ports:
      - "5180:5180"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_HOST=host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
