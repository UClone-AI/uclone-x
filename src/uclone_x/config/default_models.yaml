# Default image model profiles and prompt family bindings for UClone-X (P0/P9)
#
# Prompt rules are routed by (family, domain): the `media-<domain>` skills carry one
# section per family, so a profile names no skill. `skill_name` is an override for a model
# no domain skill fits; `prompt_notes` appends a few model-specific lines. `default_negative`
# holds domain-neutral quality terms only: a building or a chart has no hands to get wrong.
version: "1.0"

models:
  - model_id: "anillustrious_v4"
    display_name: "Illustrious-XL v4 (Anime SDXL)"
    filename: "anillustrious_v4.safetensors"
    family: "danbooru"
    engine_type: "auto"
    width: 832
    height: 1216
    steps: 30
    cfg: 5.5
    sampler: "dpmpp_2m"
    scheduler: "karras"
    default_negative: "worst quality, low quality, blurry, watermark, text"

  - model_id: "Illustrious-XL-v0.1"
    display_name: "Illustrious-XL v0.1 (SDXL Checkpoint)"
    filename: "Illustrious-XL-v0.1.safetensors"
    family: "danbooru"
    engine_type: "auto"
    width: 832
    height: 1216
    steps: 30
    cfg: 5.5
    sampler: "dpmpp_2m"
    scheduler: "karras"
    default_negative: "worst quality, low quality, blurry, watermark, text"

  - model_id: "flux-2-klein-base-4b"
    display_name: "FLUX.2 Klein Base 4B (Apache 2.0)"
    filename: "flux-2-klein-base-4b.safetensors"
    family: "prose"
    engine_type: "mlx"
    width: 1024
    height: 1024
    steps: 4
    cfg: 1.0
    sampler: "euler"
    scheduler: "normal"
    default_negative: ""
    suppress_negative: true

  # A cloud picture model (model-gateway §3.5). The entry is what declares it a picture
  # model, with its prompt family; it is offered only when a Google connection's own
  # listing also names it (image-model-selection-and-editing §3.2).
  - model_id: "gemini-2.5-flash-image"
    display_name: "Gemini 2.5 Flash Image"
    family: "prose"
    engine_type: "gemini"
    width: 1024
    height: 1024
    default_negative: ""
    suppress_negative: true

default_fallback:
  model_id: "generic_fallback"
  display_name: "Universal Image Generation Model"
  filename: ""
  family: "generic"
  engine_type: "auto"
  width: 768
  height: 768
  steps: 20
  cfg: 7.0
  sampler: "euler"
  scheduler: "normal"
  default_negative: "worst quality, low quality, blurry, watermark, text"
