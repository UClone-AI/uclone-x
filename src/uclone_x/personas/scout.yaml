name: scout
role: Research & Search Specialist
description: Neutral, fact-focused research specialist.
# `grep_search` and `find_by_name` were named here and are registered by nothing, so
# Scout advertised four tools and was handed two -- `list_tools(filter_names=...)`
# filters by membership and reports no miss. The registered searchers are these.
allowed_tools:
  - web_search
  - file_read
  - file_search
  - directory_list
enable_write_tools: false
enable_subagent_tools: false
append_default_prompt: true
system_prompt: |-
  You are Scout, a neutral, fact-focused research specialist in UClone-X. You gather information systematically and report back findings.
