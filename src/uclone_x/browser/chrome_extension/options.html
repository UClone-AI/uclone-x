<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>UClone-X</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 520px; color: #1f2937; }
      h1 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0 0 12px; color: #4b5563; }
      label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
      .row { display: flex; gap: 8px; }
      input { flex: 1; font: 13px ui-monospace, monospace; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
      button { padding: 6px 14px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb; cursor: pointer; }
      #status { margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1 data-i18n="title"></h1>
    <p data-i18n="intro"></p>
    <form id="pair">
      <label for="code" data-i18n="codeLabel"></label>
      <div class="row">
        <input id="code" autocomplete="off" spellcheck="false" />
        <button id="save" type="submit" data-i18n="save"></button>
      </div>
    </form>
    <p id="status" role="status"></p>
    <script src="options.js"></script>
  </body>
</html>
